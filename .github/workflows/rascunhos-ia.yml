name: Rascunhos de matérias com IA

# Todo dia de madrugada: lê os feeds de notícias, junta a mesma notícia de até 3 sites e pede ao
# Google Gemini uma matéria original. Os rascunhos vão para o banco (Upstash Redis) e aparecem no
# painel admin, aba "Rascunhos". Nada é publicado sozinho e nada é gravado no repositório.
#
# Secrets necessários (GitHub > Settings > Secrets and variables > Actions > New repository secret):
#   GEMINI_API_KEY            chave da API do Gemini (aistudio.google.com/apikey)
#   UPSTASH_REDIS_REST_URL    copie da Vercel (Settings > Environment Variables; pode estar como KV_REST_API_URL)
#   UPSTASH_REDIS_REST_TOKEN  copie da Vercel (pode estar como KV_REST_API_TOKEN)

on:
  schedule:
    # 1 vez por dia, de madrugada. São 3 horários porque o GitHub às vezes atrasa ou pula um;
    # só o primeiro que rodar gera rascunhos (veja o job "checar"). Hora em UTC = hora de Brasília + 3.
    - cron: "40 6 * * *"    # 03:40 em Brasília (o principal)
    - cron: "10 8 * * *"    # 05:10 em Brasília (reserva)
    - cron: "40 9 * * *"    # 06:40 em Brasília (reserva)
  workflow_dispatch:       # rodar na mão: aba Actions > Rascunhos de matérias com IA > Run workflow

permissions:
  contents: read           # só lê o repositório (as notícias publicadas, para não repetir)

concurrency:
  group: rascunhos-ia
  cancel-in-progress: false

jobs:
  # O agendador do GitHub é "quando der": em horário de pico ele atrasa horas ou pula a rodada.
  # Por isso há 3 horários por dia, e este passo faz só o PRIMEIRO que rodar trabalhar;
  # os outros veem que o trabalho de hoje (horário de Brasília) já foi feito e param em segundos.
  # Rodar na mão (Actions > Run workflow) sempre trabalha.
  checar:
    runs-on: ubuntu-latest
    permissions:
      actions: read            # só para ver as rodadas anteriores deste robô
    outputs:
      ja_rodou: ${{ steps.hoje.outputs.ja_rodou }}
    steps:
      - name: Conferir se o trabalho de hoje já foi feito
        id: hoje
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "ja_rodou=nao" >> "$GITHUB_OUTPUT"; exit 0; fi
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          N=0
          for EV in schedule workflow_dispatch; do   # filtra pelo tipo: as rodadas de publicação (push) não contam
            K=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "rascunhos-ia.yml" --event "$EV" --status success --limit 10 \
                  --json createdAt,databaseId \
                  -q "[.[] | select(.databaseId != ${{ github.run_id }})
                       | select((.createdAt | sub(\"\\\\.[0-9]+Z$\";\"Z\") | fromdateiso8601) - 10800 | strftime(\"%Y-%m-%d\") == \"$HOJE\")] | length" || echo 0)
            N=$((N + ${K:-0}))
          done
          echo "Rodadas que já trabalharam hoje ($HOJE): $N"
          if [ "${N:-0}" -gt 0 ]; then echo "ja_rodou=sim" >> "$GITHUB_OUTPUT"; else echo "ja_rodou=nao" >> "$GITHUB_OUTPUT"; fi

  rascunhos:
    needs: checar
    if: needs.checar.outputs.ja_rodou != 'sim'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar rascunhos com o Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python nizzera-games/scripts/rascunhos_ia.py
