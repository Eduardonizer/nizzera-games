name: Atualizar notícias e ofertas

on:
  schedule:
    - cron: "23 10 * * *"   # 1 vez por dia, às 10:23 UTC = 07:23 em Brasília. Fugir do minuto 0 reduz os atrasos do GitHub.
                             # Para mudar o horário, troque o 10 (hora em UTC = hora de Brasília + 3)
  workflow_dispatch:         # permite rodar na mão: aba Actions > Atualizar notícias e ofertas > Run workflow
  push:                      # quando o painel admin publica, gera as páginas das notícias na hora
    branches: [main]
    paths:
      - "nizzera-games/SITE/index.html"
      - "nizzera-games/scripts/**"
      - "nizzera-games/SITE/data/tierlists/**"   # temas da Tier List salvos pelo painel: baixa as capas na hora

permissions:
  contents: write            # deixa o robô salvar o resultado no repositório

concurrency:
  group: atualizar-noticias
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o script de ofertas
        if: github.event_name != 'push'
        continue-on-error: true      # se as lojas falharem, as notícias ainda são salvas
        run: python nizzera-games/scripts/atualizar_ofertas.py

      - name: Rodar o script de jogos grátis
        if: github.event_name != 'push'
        continue-on-error: true      # se a Epic ou a Steam falharem, as notícias ainda são salvas
        run: python nizzera-games/scripts/atualizar_gratis.py

      - name: Rodar o script dos mais jogados da Steam
        if: github.event_name != 'push'
        continue-on-error: true      # se a Steam falhar, as notícias ainda são salvas
        run: python nizzera-games/scripts/atualizar_maisjogados.py

      - name: Rodar o script de eventos (campeonatos, feiras e premiações)
        if: github.event_name != 'push'
        continue-on-error: true      # se o Liquipedia falhar, fica a lista anterior
        run: python nizzera-games/scripts/atualizar_eventos.py

      - name: Rodar o script da galeria de GTA VI (imagens oficiais da Rockstar)
        if: github.event_name != 'push'
        continue-on-error: true      # se a Rockstar mudar a página, fica a lista anterior
        run: python nizzera-games/scripts/atualizar_gta6.py

      - name: Rodar o script de notícias
        if: github.event_name != 'push'
        run: python nizzera-games/scripts/atualizar_noticias.py

      - name: Baixar as capas da Tier List
        continue-on-error: true      # se a Steam falhar, ficam as capas anteriores
        run: python nizzera-games/scripts/atualizar_tierlists.py

      - name: Gerar páginas das notícias, sitemap e feed
        run: python nizzera-games/scripts/gerar_paginas.py

      - name: Postar no Discord o que é novo (notícias, reviews, ofertas, grátis, eventos)
        continue-on-error: true      # se o Discord falhar, o site é salvo do mesmo jeito
        env:                         # os webhooks ficam em Settings > Secrets and variables > Actions
          DISCORD_WEBHOOK_TODAS_AS_NOTICIAS: ${{ secrets.DISCORD_WEBHOOK_TODAS_AS_NOTICIAS }}
          DISCORD_WEBHOOK_LANCAMENTOS: ${{ secrets.DISCORD_WEBHOOK_LANCAMENTOS }}
          DISCORD_WEBHOOK_STEAM: ${{ secrets.DISCORD_WEBHOOK_STEAM }}
          DISCORD_WEBHOOK_PLAYSTATION: ${{ secrets.DISCORD_WEBHOOK_PLAYSTATION }}
          DISCORD_WEBHOOK_XBOX: ${{ secrets.DISCORD_WEBHOOK_XBOX }}
          DISCORD_WEBHOOK_NINTENDO: ${{ secrets.DISCORD_WEBHOOK_NINTENDO }}
          DISCORD_WEBHOOK_GAME_PASS: ${{ secrets.DISCORD_WEBHOOK_GAME_PASS }}
          DISCORD_WEBHOOK_SERVICOS: ${{ secrets.DISCORD_WEBHOOK_SERVICOS }}
          DISCORD_WEBHOOK_ESPORTS: ${{ secrets.DISCORD_WEBHOOK_ESPORTS }}
          DISCORD_WEBHOOK_EVENTOS: ${{ secrets.DISCORD_WEBHOOK_EVENTOS }}
          DISCORD_WEBHOOK_REVIEWS: ${{ secrets.DISCORD_WEBHOOK_REVIEWS }}
          DISCORD_WEBHOOK_OFERTAS_DA_SEMANA: ${{ secrets.DISCORD_WEBHOOK_OFERTAS_DA_SEMANA }}
          DISCORD_WEBHOOK_JOGOS_GRATIS: ${{ secrets.DISCORD_WEBHOOK_JOGOS_GRATIS }}
          DISCORD_WEBHOOK_NOVIDADES_DO_SITE: ${{ secrets.DISCORD_WEBHOOK_NOVIDADES_DO_SITE }}
        run: python nizzera-games/scripts/discord_sync.py

      - name: Salvar no GitHub se mudou
        run: |
          if [ -n "$(git status --porcelain nizzera-games/SITE nizzera-games/scripts/discord_enviados.json)" ]; then
            git config user.name "nizzera-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A nizzera-games/SITE
            git add nizzera-games/scripts/discord_enviados.json 2>/dev/null || true   # o que já foi postado no Discord
            git commit -m "Atualiza notícias, ofertas e páginas automaticamente"
            git pull --rebase origin main
            git push origin main
          else
            echo "Sem novidades."
          fi
