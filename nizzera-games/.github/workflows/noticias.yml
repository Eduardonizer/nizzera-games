name: Atualizar notícias

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 09:00 UTC = 06:00 em Curitiba
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python atualizar_noticias.py SITE/index.html
      - name: Salvar se mudou
        run: |
          git config user.name "Nizzera Bot"
          git config user.email "bot@users.noreply.github.com"
          git add SITE/index.html
          git diff --cached --quiet || (git commit -m "Notícias do dia" && git push)
