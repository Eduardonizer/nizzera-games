<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Nizzera Games – notícias de games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#2433f0; --ink:#0e1033; --paper:#f2f0ff; --sun:#ffd23f; --coral:#ff5c7a;
  --bg:var(--paper); --fg:var(--ink); --card:#fff; --muted:#55597f; --line:#d9d6f5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0b0d2b;--fg:#f2f0ff;--card:#15184a;--muted:#a4a8d6;--line:#2a2f75}
}
:root[data-theme="dark"]{--bg:#0b0d2b;--fg:#f2f0ff;--card:#15184a;--muted:#a4a8d6;--line:#2a2f75}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.6 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;line-height:1.05;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* topo */
.hero{position:relative;background:var(--cobalt);color:#fff;overflow:hidden}
#grid{position:absolute;inset:0;width:100%;height:100%}
.wrap{position:relative;max-width:1120px;margin:0 auto;padding:0 20px}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{font:800 1.5rem "Bricolage Grotesque",sans-serif;text-decoration:none;display:flex;gap:10px;align-items:center}
.logo i{width:18px;height:18px;background:var(--sun);display:inline-block;box-shadow:6px 6px 0 var(--coral);animation:blink 2.4s steps(2) infinite}
@keyframes blink{50%{transform:translate(2px,2px);box-shadow:4px 4px 0 var(--coral)}}
.tbtn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.28)}
.heroin{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:48px 0 72px}
.heroin h1{font-size:clamp(2.4rem,6.2vw,4.8rem);font-weight:800;letter-spacing:-.02em}
.heroin p{max-width:46ch;font-size:1.1rem;opacity:.92;margin:18px 0 0}
.typed::after{content:"";display:inline-block;width:.45em;height:.9em;background:var(--sun);margin-left:6px;vertical-align:-.05em;animation:cur 1s steps(2) infinite}
@keyframes cur{50%{opacity:0}}
.feat{background:var(--paper);color:var(--ink);border-radius:20px;overflow:hidden;cursor:pointer;border:0;text-align:left;font:inherit;padding:0;width:100%;transition:transform .25s}
.feat:hover{transform:rotate(-1.2deg) translateY(-4px)}
.feat .art{aspect-ratio:16/9}
.feat .tx{padding:18px 20px 22px}
.feat h2{font-size:1.6rem;margin:8px 0}

/* filtros */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:40px 0 24px}
.chip{border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:99px;padding:7px 16px;font:500 .95rem "DM Sans",sans-serif;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}
.chip:hover{border-color:var(--cobalt)}
.chip[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:#fff;transform:scale(1.04)}
.search{margin-left:auto;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:8px 16px;font:inherit;min-width:220px}
.search:focus{border-color:var(--cobalt);outline:none}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;padding-bottom:64px}
.card{background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-6px);box-shadow:8px 8px 0 var(--sun)}
.card .art{aspect-ratio:16/10}
.card .tx{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.25rem}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.meta{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--sun);color:var(--ink);width:fit-content}
.art svg,.art img{display:block;width:100%;height:100%}
.art img{object-fit:cover;background:var(--line)}
.art{overflow:hidden}
.empty{grid-column:1/-1;text-align:center;padding:48px 0;color:var(--muted)}
.card.in{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.9)}}

/* modo carrossel */
.mode{display:inline-flex;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.mode button{border:0;background:transparent;color:var(--fg);font:500 .9rem "DM Sans",sans-serif;padding:7px 14px;cursor:pointer;transition:background .2s}
.mode button:hover{background:rgba(36,51,240,.12)}
.mode button[aria-pressed="true"]{background:var(--cobalt);color:#fff}
.marq{overflow:hidden;padding:16px 0 72px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.marq .track{display:flex;align-items:stretch;width:max-content;animation:marq var(--dur,120s) linear infinite;will-change:transform}
.marq:hover .track,.marq:focus-within .track,.marq.paused .track{animation-play-state:paused}
.marq .card{flex:none;width:300px;margin-right:22px}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq{overflow-x:auto;-webkit-mask-image:none;mask-image:none}.marq .card[aria-hidden="true"]{display:none}}

/* modal */
dialog{border:0;border-radius:20px;padding:0;max-width:640px;width:calc(100% - 32px);background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(14,16,51,.7);backdrop-filter:blur(4px)}
dialog[open]{animation:pop .3s ease-out}
dialog .art{aspect-ratio:16/8}
dialog .tx{padding:22px 26px 28px}
dialog h2{font-size:2rem;margin:10px 0}
dialog .close{position:absolute;top:12px;right:12px;border:0;border-radius:50%;width:38px;height:38px;font-size:1.2rem;cursor:pointer;background:var(--paper);color:var(--ink)}
footer{background:var(--ink);color:#c9ccf5;padding:32px 0;font-size:.9rem}
@media (max-width:820px){.heroin{grid-template-columns:1fr;padding-bottom:48px}.search{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

dialog a{color:inherit;text-decoration:underline;font-weight:700}

/* ===== menu lateral ===== */
:root{--sw:232px}
html.nav-collapsed{--sw:76px}
html{scroll-behavior:smooth}
body{padding-left:var(--sw);transition:padding-left .25s}
#topo,#feat,#noticias{scroll-margin-top:16px}
.side{position:fixed;inset:0 auto 0 0;width:var(--sw);background:var(--ink);color:#e6e8ff;z-index:20;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));border-right:1px solid rgba(255,255,255,.08);transition:width .25s,transform .25s,visibility 0s}
.side .brand{display:flex;align-items:center;gap:12px;padding:6px 12px;text-decoration:none;font:800 1.15rem "Bricolage Grotesque",sans-serif;color:#fff;white-space:nowrap}
.side .brand i{flex:none;width:16px;height:16px;background:var(--sun);box-shadow:5px 5px 0 var(--coral);margin-right:5px}
.slist{flex:1;overflow-y:auto;overflow-x:hidden;margin-top:14px;display:flex;flex-direction:column}
.grp{font:700 .7rem/1 "DM Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#8a8fd0;margin:20px 12px 8px;white-space:nowrap}
.item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:transparent;color:inherit;font:500 .95rem "DM Sans",sans-serif;text-align:left;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .2s}
.item:hover{background:rgba(255,255,255,.09)}
.item svg{flex:none;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item .n{margin-left:auto;font-size:.75rem;background:rgba(255,255,255,.12);padding:1px 9px;border-radius:99px}
.item[aria-current="true"]{background:var(--cobalt);color:#fff;font-weight:700}
.item[aria-current="true"] .n{background:rgba(255,255,255,.25)}
.item[aria-current="true"]::before{content:"";position:absolute;left:-12px;top:50%;width:6px;height:20px;transform:translateY(-50%);background:var(--sun);border-radius:0 3px 3px 0}
.side .foot{border-top:1px solid rgba(255,255,255,.1);padding-top:10px;margin-top:10px}
.item.collapse svg{transition:transform .25s}
.mbtn,.sclose,.scrim{display:none}
@media (min-width:900px){
  html.nav-collapsed .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  html.nav-collapsed .item .n{display:none}
  html.nav-collapsed .item{justify-content:center;padding:12px 0}
  html.nav-collapsed .item[aria-current="true"]::before{left:-12px}
  html.nav-collapsed .grp{font-size:0;height:1px;background:rgba(255,255,255,.12);margin:14px 10px}
  html.nav-collapsed .side .brand{padding:6px 0;justify-content:center;font-size:0;gap:0}
  html.nav-collapsed .side .brand i{margin:0 5px 0 0}
  html.nav-collapsed .item.collapse svg{transform:rotate(180deg)}
}
@media (max-width:899px){
  :root{--sw:0px}
  .side{width:min(280px,86vw);transform:translateX(-100%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
  html.menu-open .side{transform:none;visibility:visible;transition:transform .25s}
  .item.collapse{display:none}
  .mbtn{display:grid;place-items:center;position:fixed;z-index:30;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:44px;height:44px;border:0;border-radius:50%;background:var(--sun);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--coral)}
  .mbtn svg,.sclose svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
  html.menu-open .mbtn{display:none}
  .sclose{display:grid;place-items:center;position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
  .scrim{display:block;position:fixed;inset:0;z-index:15;background:rgba(14,16,51,.6);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s}
  html.menu-open .scrim{opacity:1;pointer-events:auto}
  nav .logo{margin-left:56px}
}
footer .by{margin:14px 0 0;display:flex;align-items:center;gap:10px;font-size:1rem}
footer .by::before{content:"";width:10px;height:10px;background:var(--sun);box-shadow:4px 4px 0 var(--coral);margin-right:4px}
footer .by strong{color:#fff;font-weight:700}

/* ===== área admin ===== */
html.adm-open{overflow:hidden}
.adm[hidden]{display:none}
.adm{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.a-top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--ink);color:#fff;flex-wrap:wrap}
.a-title{font:800 1.25rem "Bricolage Grotesque",sans-serif;margin-right:6px}
.a-sp{flex:1}
.a-chip{font-size:.8rem;padding:3px 12px;border-radius:99px;background:rgba(255,255,255,.14)}
.a-chip.warn{background:var(--sun);color:var(--ink);font-weight:700}
.a-btn{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 14px;font:500 .92rem "DM Sans",sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
.a-btn:hover{border-color:var(--cobalt)}
.a-btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:700}
.a-btn.dan{color:#d6294b;border-color:#d6294b}
.a-top .a-btn{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.a-top .a-btn:hover{background:rgba(255,255,255,.24)}
.a-tabs{display:flex;gap:6px;padding:8px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--card)}
.a-tab{border:0;background:transparent;color:var(--muted);padding:10px 14px;font:700 .95rem "DM Sans",sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.a-tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--cobalt)}
.a-body{flex:1;overflow:auto;padding:20px calc(20px + env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.a-wrap{max-width:760px;margin:0 auto;display:grid;gap:20px}
.a-card{background:var(--card);border-radius:16px;padding:20px 22px 24px;border:1px solid var(--line)}
.a-card h2{font-size:1.35rem;margin:0 0 8px}
.a-card h3{font-size:1.05rem;margin:22px 0 4px}
.a-card label{display:block;font-weight:700;font-size:.85rem;margin:14px 0 6px}
.a-in{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:9px 12px;font:inherit}
.a-in:focus{border-color:var(--cobalt);outline:none}
textarea.a-in{resize:vertical;line-height:1.5}
.a-hint{color:var(--muted);font-size:.88rem;margin:6px 0}
.a-err{color:#d6294b;font-weight:700;font-size:.9rem;min-height:1.2em;margin-top:10px}
.a-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.a-news{display:grid;grid-template-columns:minmax(270px,360px) 1fr;gap:20px;align-items:start;max-width:1200px;margin:0 auto}
.a-list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:0;max-height:calc(100vh - 170px);display:flex;flex-direction:column;gap:10px}
.a-lhead{display:flex;gap:8px;flex-wrap:wrap}
.a-items{overflow:auto;display:grid;gap:6px;align-content:start}
.a-rowi{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:6px;border-radius:12px;border:2px solid transparent}
.a-rowi.on{background:rgba(36,51,240,.1);border-color:var(--cobalt)}
.a-th{width:72px;aspect-ratio:16/10;border-radius:8px;background:var(--line)}
.a-pick{border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0;display:grid;gap:2px;min-width:0}
.a-pick b{font-size:.92rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a-pick small{color:var(--muted)}
.a-mv{display:grid;gap:4px}
.a-mv button,.a-crow button{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;width:30px;height:26px;cursor:pointer}
.a-mv button:hover,.a-crow button:hover:not(:disabled){border-color:var(--cobalt)}
.a-crow button:disabled{opacity:.35;cursor:not-allowed}
.a-ph{color:var(--muted)}
.a-row3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.a-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.a-cover{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:18px;align-items:start;margin-top:8px}
.a-prev{aspect-ratio:16/10;border-radius:12px;background:var(--line);width:100%}
.a-chk{display:flex!important;align-items:center;gap:10px;font-weight:500!important;font-size:.95rem!important;margin-top:18px!important}
.a-chk input{width:18px;height:18px}
.a-crow{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;align-items:center;margin:8px 0}
.a-steps{margin:8px 0;padding-left:20px}
.a-steps li{margin:4px 0}
.a-login{flex:1;display:grid;place-items:center;padding:20px}
.a-login .a-card{width:min(420px,100%)}
.a-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:120;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;max-width:min(92vw,520px);font-size:.95rem;transition:opacity .25s,transform .25s;box-shadow:4px 4px 0 var(--sun)}
.a-toast.show{opacity:1;transform:translate(-50%,0)}
.a-toast.err{background:#c62848;box-shadow:4px 4px 0 var(--ink)}
footer .adminlink{margin:10px 0 0;font-size:.82rem;opacity:.7}
@media (max-width:899px){
  .a-news{grid-template-columns:1fr}
  .a-list{position:static;max-height:none}
  .a-items{max-height:300px}
  .a-cover,.a-row3,.a-row2{grid-template-columns:1fr}
  .a-crow{grid-template-columns:1fr auto auto auto}
  .a-crow small{display:none}
}
</style>
</head>
<body>
<button class="mbtn" id="mbtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="side"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="scrim" id="scrim"></div>
<aside class="side" id="side" aria-label="Menu lateral">
  <a class="brand" href="#topo" data-go="topo" title="Nizzera Games"><i></i><span class="lbl sname">Nizzera Games</span></a>
  <button class="sclose" id="sclose" type="button" aria-label="Fechar menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="slist" id="slist" role="navigation" aria-label="Menu principal"></div>
</aside>
<header class="hero" id="topo">
  <canvas id="grid" aria-hidden="true"></canvas>
  <div class="wrap">
    <nav>
      <a class="logo" href="#"><i></i><span class="sname">Nizzera Games</span></a>
      <button class="tbtn" id="theme" type="button">Alternar tema</button>
    </nav>
    <div class="heroin">
      <div>
        <h1 id="typed" class="typed" aria-label="Tudo que rolou no mundo dos games."></h1>
        <p id="intro">Lançamentos, Nintendo, Xbox e esports, em textos curtos e sem enrolação. Mova o mouse sobre o fundo e acenda os pixels.</p>
      </div>
      <button class="feat" id="feat" type="button"></button>
    </div>
  </div>
</header>

<main class="wrap" id="noticias">
  <div class="tools" role="group" aria-label="Filtrar por categoria" id="chips"></div>
  <div class="cards" id="cards" aria-live="polite"></div>
</main>

<dialog id="modal" aria-label="Notícia">
  <button class="close" id="close" type="button" aria-label="Fechar">✕</button>
  <div id="mbody"></div>
</dialog>

<footer><div class="wrap"><span id="ftxt"></span><p class="by">Criado por <strong id="fcredit"></strong></p></div></footer>
<div id="admin" class="adm" hidden></div>

(function(){

  function pos(e){var r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;poke(p.clientX-r.left,p.clientY-r.top,1)}
  addEventListener("pointermove",pos);addEventListener("touchmove",pos,{passive:true});addEventListener("resize",size);size();
  if(reduce)return;
  var tick=0;
  (function loop(){
    tick++; if(tick%40===0)poke(Math.random()*cv.clientWidth,Math.random()*cv.clientHeight,.6);
    g.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      var k=cols*y+x,h=heat[k];

    }
    requestAnimationFrame(loop);
  })();
})();

/* ===== menu lateral: edite os itens aqui ===== */
(function(){

  var IC={
    home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',

    search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
    theme:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 010 16z" fill="currentColor"/>',
    monitor:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
    ticket:'<path d="M4 8a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2a2 2 0 000-4z"/><path d="M14 6v12"/>',
    chev:'<path d="M15 6l-6 6 6 6"/>'
  };
  var CATICON={"Todas":"news","Lançamentos":"rocket","Nintendo":"pad","Serviços":"cloud","Steam":"monitor","Game Pass":"ticket","Esports":"trophy","Eventos":"cal"};
  function svg(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
  function count(c){return c==="Todas"?NEWS.length:NEWS.filter(function(n){return n.cat===c}).length}
  function buildSide(){
  var h='<div class="grp">Navegar</div>'
   +'<a class="item" href="#topo" data-go="topo" title="Início">'+svg("home")+'<span class="lbl">Início</span></a>'
   +'<a class="item" href="#feat" data-go="feat" title="Destaque do dia">'+svg("star")+'<span class="lbl">Destaque</span></a>'
   +'<div class="grp">Notícias</div>';
  CATS.forEach(function(c){
    var lab=esc(c==="Todas"?"Todas as notícias":c);
    h+='<button class="item" type="button" data-cat="'+esc(c)+'" title="'+lab+'">'+svg(CATICON[c]||"tag")+'<span class="lbl">'+lab+'</span><span class="n">'+count(c)+'</span></button>';
  });
  h+='<div class="grp">Ferramentas</div>'
   +'<button class="item" type="button" data-act="search" title="Buscar notícia">'+svg("search")+'<span class="lbl">Buscar</span></button>'
   +'<button class="item" type="button" data-act="theme" title="Alternar tema claro/escuro">'+svg("theme")+'<span class="lbl">Tema claro/escuro</span></button>'
   +'<div style="flex:1"></div><div class="foot"><button class="item collapse" type="button" data-act="collapse" title="Recolher ou expandir menu">'+svg("chev")+'<span class="lbl">Recolher menu</span></button></div>';
  list.innerHTML=h;
  items=[].slice.call(list.querySelectorAll(".item"));
  if(typeof update==="function")update();
  }
  var items=[], brand=document.querySelector(".side .brand");
  var smooth=!matchMedia("(prefers-reduced-motion:reduce)").matches;
  function go(id){var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:smooth?"smooth":"auto",block:"start"})}
  function setCat(c){var b=[].filter.call(document.querySelectorAll("#chips .chip"),function(x){return x.textContent===c})[0];if(b)b.click()}
  function section(){var s="topo";["feat","noticias"].forEach(function(id){var el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<=100)s=id});return s}
  function update(){
    var s=section();
    items.forEach(function(it){
      var on=false;
      if(it.dataset.go)on=it.dataset.go===s;
      else if(it.dataset.cat)on=(s==="noticias"&&cat===it.dataset.cat);
      if(on)it.setAttribute("aria-current","true");else it.removeAttribute("aria-current");
    });
  }
  function openMenu(o){
    html.classList.toggle("menu-open",o);mbtn.setAttribute("aria-expanded",o);
    if(o){var f=list.querySelector(".item");if(f)f.focus()}else if(matchMedia("(max-width:899px)").matches)mbtn.focus();
  }
  function closeMenu(){if(html.classList.contains("menu-open"))openMenu(false)}

  document.getElementById("side").addEventListener("click",function(e){
    var it=e.target.closest(".item,.brand");if(!it)return;
    if(it.dataset.go){e.preventDefault();go(it.dataset.go);closeMenu()}
    else if(it.dataset.cat){setCat(it.dataset.cat);go("noticias");closeMenu()}
    else if(it.dataset.act==="search"){closeMenu();go("noticias");setTimeout(function(){var q=document.querySelector(".search");if(q)q.focus({preventScroll:true})},smooth?450:0)}
    else if(it.dataset.act==="theme"){document.getElementById("theme").click()}
    else if(it.dataset.act==="collapse"){var c=html.classList.toggle("nav-collapsed");try{localStorage.setItem("nz-nav",c?"1":"0")}catch(_){}}
  });
  mbtn.onclick=function(){openMenu(true)};
  document.getElementById("sclose").onclick=function(){openMenu(false)};
  document.getElementById("scrim").onclick=function(){openMenu(false)};
  addEventListener("keydown",function(e){if(e.key==="Escape")closeMenu()});
  addEventListener("resize",function(){if(!matchMedia("(max-width:899px)").matches)html.classList.remove("menu-open")});
  try{if(localStorage.getItem("nz-nav")==="1")html.classList.add("nav-collapsed")}catch(_){}

  var tick=false;
  addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(function(){tick=false;update()})}},{passive:true});
  var _render=render;render=function(){_render();update()};
  window.buildSide=buildSide;buildSide();
})();
</script>

<script>
/* ===== área admin ===== */
(function(){
  var adm=document.getElementById("admin"),html=document.documentElement;
  var AKEY="nz-admin",SKEY="nz-auth",UKEY="nz-unpub",FILE="index.html";
  var st={tab:"news",sel:null,draft:null,isNew:false,dirty:false,q:"",cats:[]},tt,authOk=false;
  function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(_){return false}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(_){}}
  function $(s){return adm.querySelector(s)}
  var toastEl=document.createElement("div");toastEl.id="a-toast";toastEl.className="a-toast";toastEl.setAttribute("role","status");toastEl.setAttribute("aria-live","polite");document.body.appendChild(toastEl);
  function toast(m,err){toastEl.textContent=m;toastEl.className="a-toast show"+(err?" err":"");clearTimeout(tt);tt=setTimeout(function(){toastEl.className="a-toast"},err?6500:2800)}

  /* ---- utilidades ---- */
  function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
  function words(s){return String(s||"").trim().split(/\s+/).filter(Boolean).length}
  function nextId(){return DATA.news.reduce(function(m,n){return Math.max(m,n.id)},0)+1}
  function find(id){return DATA.news.filter(function(n){return n.id===id})[0]}
  function idx(id){for(var i=0;i<DATA.news.length;i++)if(DATA.news[i].id===id)return i;return -1}
  function fld(label,id,val,type){return '<label for="'+id+'">'+label+'</label><input class="a-in" id="'+id+'" type="'+(type||"text")+'" value="'+esc(val==null?"":val)+'">'}
  function area(label,id,val,rows){return '<label for="'+id+'">'+label+'</label><textarea class="a-in" id="'+id+'" rows="'+rows+'">'+esc(val==null?"":val)+'</textarea>'}
  function hashPw(p){
    if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest("SHA-256",new TextEncoder().encode("nz:"+p)).then(function(b){return [].map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")});
    var h=5381;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))|0;return Promise.resolve("d"+h);
  }
  var fails=0,lockUntil=0;
  function authed(){if(authOk)return true;try{return sessionStorage.getItem(SKEY)==="1"}catch(_){return false}}
  function login(){authOk=true;try{sessionStorage.setItem(SKEY,"1")}catch(_){}}

  /* ---- salvar (com reversão se o navegador não deixar gravar) ---- */
  function persist(){
    if(!lsSet(DKEY,JSON.stringify(DATA))){toast("Não deu para salvar neste navegador (armazenamento cheio ou bloqueado). Tente uma imagem menor ou um link de imagem.",true);return false}
    lsSet(UKEY,"1");return true;
  }
  function mutate(fn,msg){
    var snap=JSON.stringify(DATA);fn();
    if(!persist()){DATA=JSON.parse(snap);return false}
    refreshAll();status();if(msg)toast(msg);return true;
  }
  function status(){var c=$("#a-status");if(!c)return;var u=lsGet(UKEY)==="1";c.className="a-chip"+(u?" warn":"");c.textContent=u?"● Alterações ainda não publicadas":"✓ Tudo publicado"}

  /* ---- abrir / fechar ---- */
  function openAdmin(){adm.hidden=false;html.classList.add("adm-open");paint();adm.scrollTop=0}
  function closeAdmin(skip){
    if(!adm.hidden&&st.dirty&&!skip&&!confirm("Há alterações não salvas. Sair mesmo assim?"))return false;
    st.dirty=false;st.draft=null;st.isNew=false;st.sel=null;adm.hidden=true;html.classList.remove("adm-open");
    if(location.hash==="#admin"){try{history.replaceState(null,"",location.href.split("#")[0])}catch(_){location.hash=""}}
    return true;
  }
  function paint(){if(!authed()){loginView();return}shell();tab(st.tab)}

  /* ---- login ---- */
  function loginView(){
    var has=!!lsGet(AKEY);
    adm.innerHTML='<div class="a-login"><form id="a-lf" class="a-card" novalidate><h2>'+(has?"Entrar na área admin":"Criar senha do admin")+'</h2><p class="a-hint">'+(has?"Digite a senha deste painel.":"Defina uma senha para abrir este painel neste navegador.")+'</p>'
      +'<label for="l-pw">Senha</label><input class="a-in" id="l-pw" type="password" autocomplete="'+(has?"current-password":"new-password")+'">'
      +(has?"":'<label for="l-pw2">Repita a senha</label><input class="a-in" id="l-pw2" type="password" autocomplete="new-password">')
      +'<div class="a-err" id="l-err" role="alert"></div><div class="a-act"><button class="a-btn pri" type="submit">'+(has?"Entrar":"Criar senha e entrar")+'</button><button class="a-btn" type="button" id="l-back">Voltar ao site</button></div>'
      +'<p class="a-hint">Atenção: esta senha só tranca o painel neste navegador. Ela não protege o arquivo do site.</p></form></div>';
    setTimeout(function(){var i=$("#l-pw");if(i)i.focus()},30);
  }

  /* ---- estrutura ---- */
  function shell(){
    adm.innerHTML='<div class="a-top"><strong class="a-title">Área admin</strong><span class="a-chip" id="a-status"></span><span class="a-sp"></span><button class="a-btn" type="button" id="a-view">Ver site</button><button class="a-btn" type="button" id="a-out">Sair</button></div>'
      +'<div class="a-tabs" role="tablist"><button class="a-tab" role="tab" type="button" data-tab="news">Notícias</button><button class="a-tab" role="tab" type="button" data-tab="site">Site e categorias</button><button class="a-tab" role="tab" type="button" data-tab="back">Publicar e backup</button></div><div class="a-body" id="a-body"></div>';
    status();
  }
  function tab(n){
    if(n!==st.tab){if(st.dirty&&!confirm("Descartar alterações não salvas?"))return;st.dirty=false;st.draft=null;st.sel=null;st.isNew=false}
    st.tab=n;
    [].forEach.call(adm.querySelectorAll(".a-tab"),function(b){b.setAttribute("aria-selected",b.dataset.tab===n)});
    ({news:newsView,site:siteView,back:backView})[n]();
  }

  /* ---- aba Notícias ---- */
  function newsView(){
    $("#a-body").innerHTML='<div class="a-news"><aside class="a-list" aria-label="Lista de notícias"><div class="a-lhead"><button class="a-btn pri" type="button" id="a-new">+ Nova notícia</button><button class="a-btn" type="button" id="a-sort" title="Mais recentes primeiro">Ordenar por data</button></div>'
      +'<input class="a-in" id="a-q" type="search" placeholder="Buscar na lista" aria-label="Buscar na lista" value="'+esc(st.q)+'"><div class="a-items" id="a-items"></div></aside><section id="a-edit"></section></div>';
    items();editor();
  }
  function items(){
    var q=st.q.toLowerCase(),h="";
    DATA.news.forEach(function(n){
      if(q&&(n.title+" "+n.cat).toLowerCase().indexOf(q)<0)return;
      h+='<div class="a-rowi'+(n.id===st.sel?" on":"")+'"><div class="art a-th">'+pic(n)+'</div><button type="button" class="a-pick" data-pick="'+n.id+'"><b>'+esc(n.title||"(sem título)")+'</b><small>'+esc(n.cat)+" · "+esc(fmt(n.date))+(n.featured?" · ★ destaque":"")+'</small></button>'
       +'<span class="a-mv"><button type="button" data-mv="-1" data-mid="'+n.id+'" aria-label="Subir" title="Subir">↑</button><button type="button" data-mv="1" data-mid="'+n.id+'" aria-label="Descer" title="Descer">↓</button></span></div>';
    });
    $("#a-items").innerHTML=h||'<p class="a-hint">Nenhuma notícia encontrada.</p>';
  }
  function editor(){
    var box=$("#a-edit"),d=st.draft;
    if(!d){box.innerHTML='<div class="a-card a-ph"><h2>Editar notícia</h2><p>Escolha uma notícia na lista ao lado ou crie uma nova.</p></div>';return}
    var opts=DATA.cats.map(function(c){return '<option'+(c===d.cat?" selected":"")+'>'+esc(c)+'</option>'}).join("");
    var isData=/^data:/.test(d.img||"");
    var pos=[["","Centro"],["top","Topo"],["bottom","Base"]].map(function(p){return '<option value="'+p[0]+'"'+((d.pos||"")===p[0]?" selected":"")+'>'+p[1]+'</option>'}).join("");
    box.innerHTML='<form id="a-form" class="a-card" novalidate><h2>'+(st.isNew?"Nova notícia":"Editar notícia")+'</h2>'
      +fld("Título","f-title",d.title)
      +'<div class="a-row3"><div><label for="f-cat">Categoria</label><select class="a-in" id="f-cat">'+opts+'</select></div><div><label for="f-date">Data</label><input class="a-in" id="f-date" type="date" value="'+esc(d.date)+'"></div><div><label for="f-read">Leitura (min)</label><input class="a-in" id="f-read" type="number" min="1" max="60" placeholder="auto" value="'+esc(d.read||"")+'"></div></div>'
      +area("Resumo (aparece no card)","f-sum",d.sum,2)
      +area("Texto completo (uma linha em branco separa os parágrafos)","f-body",d.body,8)
      +'<div class="a-row2"><div>'+fld("Nome da fonte","f-src",d.src)+'</div><div>'+fld("Link da matéria original","f-url",d.url,"url")+'</div></div>'
      +'<h3>Capa</h3><div class="a-cover"><div class="art a-prev" id="a-prev"></div><div>'
      +'<label for="f-img" style="margin-top:0">Endereço (link) da imagem</label><input class="a-in" id="f-img" type="url" placeholder="'+(isData?"Imagem enviada do computador":"https://...")+'" value="'+esc(isData?"":d.img)+'">'
      +'<div class="a-act"><button type="button" class="a-btn" id="a-up">Enviar do computador</button><button type="button" class="a-btn" id="a-pix">Usar arte em pixel</button></div><input type="file" id="a-file" accept="image/*" hidden>'
      +'<label for="f-pos">Enquadramento</label><select class="a-in" id="f-pos">'+pos+'</select>'
      +fld("Texto alternativo (para leitores de tela)","f-alt",d.alt)+fld("Crédito da imagem (opcional)","f-credit",d.credit)+'</div></div>'
      +'<label class="a-chk"><input type="checkbox" id="f-feat"'+(d.featured?" checked":"")+'> Mostrar como destaque no topo do site</label>'
      +'<div class="a-err" id="f-err" role="alert"></div>'
      +'<div class="a-act"><button class="a-btn pri" type="submit">Salvar</button><button type="button" class="a-btn" id="a-disc">Descartar alterações</button>'+(st.isNew?"":'<button type="button" class="a-btn dan" id="a-del">Excluir</button>')+'</div></form>';
    preview();
  }
  function readForm(){
    var d=st.draft;if(!d||!$("#a-form"))return;
    d.title=$("#f-title").value.trim();d.cat=$("#f-cat").value;d.date=$("#f-date").value;d.read=parseInt($("#f-read").value,10)||0;
    d.sum=$("#f-sum").value.trim();d.body=$("#f-body").value.trim();d.src=$("#f-src").value.trim();d.url=$("#f-url").value.trim();
    d.alt=$("#f-alt").value.trim();d.credit=$("#f-credit").value.trim();d.pos=$("#f-pos").value;d.featured=$("#f-feat").checked;
  }
  function preview(){var d=st.draft,p=$("#a-prev");if(!p||!d)return;p.innerHTML=pic({id:d.id,img:d.img,alt:d.alt,title:d.title,pos:d.pos})}
  function pick(id){
    if(st.dirty&&!confirm("Descartar alterações não salvas?"))return;
    st.dirty=false;st.isNew=false;st.sel=id;st.draft=clone(find(id));items();editor();
    if(innerWidth<900)$("#a-edit").scrollIntoView({behavior:"smooth",block:"start"});
  }
  function addNew(){
    if(st.dirty&&!confirm("Descartar alterações não salvas?"))return;
    st.dirty=false;st.isNew=true;st.sel=null;
    st.draft={id:nextId(),img:"",alt:"",pos:"",credit:"",cat:DATA.cats[0]||"",title:"",date:today(),read:0,sum:"",body:"",src:"",url:"",featured:false};
    items();editor();var t=$("#f-title");if(t)t.focus();
    if(innerWidth<900)$("#a-edit").scrollIntoView({behavior:"smooth",block:"start"});
  }
  function saveNews(){
    var d=st.draft;if(!d)return;readForm();var err=$("#f-err");err.textContent="";
    if(!d.title){err.textContent="Dê um título à notícia.";$("#f-title").focus();return}
    if(!d.cat){err.textContent="Crie uma categoria na aba “Site e categorias” antes de salvar.";return}
    if(d.url&&!/^https?:\/\//i.test(d.url)){err.textContent="O link da matéria precisa começar com http:// ou https://";$("#f-url").focus();return}
    if(d.img&&/^\s*(javascript:|data:(?!image\/))/i.test(d.img)){err.textContent="Endereço de imagem inválido.";$("#f-img").focus();return}
    if(!d.date)d.date=today();
    if(!d.read)d.read=Math.max(1,Math.round(words(d.body||d.sum)/180));
    var ok=mutate(function(){
      if(d.featured)DATA.news.forEach(function(x){x.featured=false});
      if(st.isNew)DATA.news.unshift(clone(d));else DATA.news[idx(d.id)]=clone(d);
    },"Notícia salva.");
    if(ok){st.isNew=false;st.sel=d.id;st.dirty=false;st.draft=clone(find(d.id));items();editor()}
  }
  function delNews(){
    var d=st.draft;if(!d||st.isNew)return;
    if(!confirm("Excluir “"+d.title+"”? Para desfazer só importando um backup.")) return;
    if(mutate(function(){DATA.news.splice(idx(d.id),1)},"Notícia excluída.")){st.sel=null;st.draft=null;st.dirty=false;items();editor()}
  }
  function move(id,dir){
    var i=idx(id),j=i+dir;if(i<0||j<0||j>=DATA.news.length)return;
    mutate(function(){var t=DATA.news[i];DATA.news[i]=DATA.news[j];DATA.news[j]=t});items();
  }
  function onFile(f){
    if(!f)return;if(!/^image\//.test(f.type)){toast("Escolha um arquivo de imagem.",true);return}
    var fr=new FileReader();fr.onerror=function(){toast("Não consegui ler o arquivo.",true)};
    fr.onload=function(){
      var im=new Image();im.onerror=function(){toast("Não consegui abrir essa imagem.",true)};
      im.onload=function(){
        var r=Math.min(1,1200/im.width),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
        var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        st.draft.img=c.toDataURL("image/jpeg",.82);st.dirty=true;
        var fi=$("#f-img");fi.value="";fi.placeholder="Imagem enviada do computador";preview();toast("Imagem carregada. Clique em Salvar para aplicar.");
      };im.src=fr.result;
    };fr.readAsDataURL(f);
  }

  /* ---- aba Site e categorias ---- */
  function siteView(){
    var S=DATA.site;st.cats=DATA.cats.map(function(c){return {orig:c,name:c}});
    $("#a-body").innerHTML='<div class="a-wrap"><form id="a-site" class="a-card" novalidate><h2>Textos do site</h2>'
      +fld("Nome do site","s-name",S.name)+fld("Frase animada do topo","s-tag",S.tagline)+area("Texto abaixo da frase","s-intro",S.intro,3)+area("Texto do rodapé","s-foot",S.footer,3)+fld("Criado por (deixe vazio para ocultar)","s-cred",S.credit)
      +'<div class="a-act"><button class="a-btn pri" type="submit">Salvar textos</button></div></form>'
      +'<div class="a-card"><h2>Categorias</h2><p class="a-hint">A ordem aqui é a ordem dos filtros e do menu lateral. Uma categoria só pode ser excluída quando não tem notícias.</p><div id="a-cats"></div>'
      +'<div class="a-err" id="c-err" role="alert"></div><div class="a-act"><button class="a-btn" type="button" id="a-addcat">+ Adicionar categoria</button><button class="a-btn pri" type="button" id="a-savecats">Salvar categorias</button></div></div></div>';
    catRows();
  }
  function catCount(c){return DATA.news.filter(function(n){return n.cat===c}).length}
  function catRows(){
    $("#a-cats").innerHTML=st.cats.map(function(c,i){var n=c.orig?catCount(c.orig):0;
      return '<div class="a-crow"><input class="a-in" data-ci="'+i+'" value="'+esc(c.name)+'" aria-label="Nome da categoria"><small class="a-hint">'+n+' notícia(s)</small><button type="button" data-cm="-1" data-ci="'+i+'" aria-label="Subir" title="Subir">↑</button><button type="button" data-cm="1" data-ci="'+i+'" aria-label="Descer" title="Descer">↓</button><button type="button" data-cd="'+i+'" aria-label="Excluir"'+(n?' disabled title="Mova ou exclua as notícias desta categoria primeiro"':' title="Excluir"')+'>✕</button></div>'}).join("")||'<p class="a-hint">Nenhuma categoria.</p>';
  }
  function saveSite(){
    var g=function(i){return $(i).value.trim()};
    if(!g("#s-name")){toast("O nome do site não pode ficar vazio.",true);return}
    mutate(function(){DATA.site={name:g("#s-name"),tagline:g("#s-tag"),intro:g("#s-intro"),footer:g("#s-foot"),credit:g("#s-cred")}},"Textos salvos.");
  }
  function saveCats(){
    var err=$("#c-err"),names=st.cats.map(function(c){return c.name.trim()}),low={};err.textContent="";
    for(var i=0;i<names.length;i++){
      if(!names[i]){err.textContent="Há uma categoria sem nome.";return}
      if(names[i].toLowerCase()==="todas"){err.textContent="“Todas” já existe automaticamente; escolha outro nome.";return}
      if(low[names[i].toLowerCase()]){err.textContent="Há categorias repetidas: “"+names[i]+"”.";return}
      low[names[i].toLowerCase()]=1;
    }
    var map={};st.cats.forEach(function(c,i){if(c.orig)map[c.orig]=names[i]});
    if(mutate(function(){DATA.news.forEach(function(n){if(map.hasOwnProperty(n.cat))n.cat=map[n.cat]});DATA.cats=names.slice()},"Categorias salvas.")){siteView()}
  }

  /* ---- aba Publicar e backup ---- */
  function backView(){
    $("#a-body").innerHTML='<div class="a-wrap">'
      +'<div class="a-card"><h2>Publicar suas alterações</h2><ol class="a-steps"><li>Edite as notícias e os textos (as mudanças já aparecem neste navegador).</li><li>Clique em <b>Baixar site atualizado</b>.</li><li>Troque o arquivo antigo por esse novo no lugar onde o site está hospedado.</li></ol><p class="a-hint">Até você fazer isso, só você vê as alterações, e só neste navegador.</p><div class="a-act"><button class="a-btn pri" type="button" id="a-dl">Baixar site atualizado (.html)</button></div></div>'
      +'<div class="a-card"><h2>Backup das notícias</h2><p class="a-hint">Um arquivo .json com todas as notícias, categorias e textos. Serve para guardar uma cópia ou levar para outro navegador.</p><div class="a-act"><button class="a-btn" type="button" id="a-json">Baixar notícias (.json)</button><button class="a-btn" type="button" id="a-imp">Importar notícias (.json)</button></div><input type="file" id="a-impf" accept=".json,application/json" hidden></div>'
      +'<form id="a-pwf" class="a-card" novalidate><h2>Senha do painel</h2>'+fld("Nova senha","p-new","","password")+fld("Repita a nova senha","p-new2","","password")+'<div class="a-err" id="p-err" role="alert"></div><div class="a-act"><button class="a-btn" type="submit">Trocar senha</button></div></form>'
      +'<div class="a-card"><h2>Voltar ao original</h2><p class="a-hint">Apaga as alterações feitas neste navegador e volta ao conteúdo que está dentro do arquivo do site.</p><div class="a-act"><button class="a-btn dan" type="button" id="a-reset">Descartar alterações deste navegador</button></div></div></div>';
    var f=$("#p-new");if(f)f.setAttribute("autocomplete","new-password");
  }
  function norm(d){
    if(!d||!Array.isArray(d.news))return null;
    var o={site:{},cats:[],news:[]},s=d.site||{},seen={};
    ["name","tagline","intro","footer","credit"].forEach(function(k){o.site[k]=String(s[k]==null?BASE.site[k]:s[k])});
    d.news.forEach(function(n,i){
      if(!n||!n.title)return;var id=+n.id||i+1;while(seen[id])id++;seen[id]=1;
      o.news.push({id:id,img:String(n.img||""),alt:String(n.alt||""),credit:String(n.credit||""),pos:/^(top|bottom)$/.test(n.pos)?n.pos:"",cat:String(n.cat||""),title:String(n.title),date:String(n.date||""),read:+n.read||0,sum:String(n.sum||""),body:String(n.body||""),src:String(n.src||""),url:String(n.url||""),featured:!!n.featured});
    });
    var cs=(Array.isArray(d.cats)?d.cats:[]).map(String).filter(function(c){return c&&c!=="Todas"});
    o.news.forEach(function(n){if(n.cat&&cs.indexOf(n.cat)<0)cs.push(n.cat)});
    o.cats=cs;return o;
  }
  function jsonForHtml(o){return JSON.stringify(o,null,1).replace(/</g,"\\u003c")}
  function buildHtml(){
    var c=document.documentElement.cloneNode(true);
    ["class","data-theme","style"].forEach(function(a){c.removeAttribute(a)});
    ["#cards","#chips","#feat","#slist","#mbody","#typed"].forEach(function(s){var e=c.querySelector(s);if(e)e.innerHTML=""});
    var f=c.querySelector("#feat");if(f)f.removeAttribute("hidden");
    var a=c.querySelector("#admin");if(a){a.innerHTML="";a.setAttribute("hidden","")}
    var t=c.querySelector("#a-toast");if(t)t.remove();
    var g=c.querySelector("#grid");if(g)["width","height","style"].forEach(function(k){g.removeAttribute(k)});
    var mb=c.querySelector("#mbtn");if(mb)mb.setAttribute("aria-expanded","false");
    var m=c.querySelector("#modal");if(m)m.removeAttribute("open");
    var d=c.querySelector("#nz-data");d.textContent="\n"+jsonForHtml(DATA)+"\n";
    return "<!DOCTYPE html>\n"+c.outerHTML;
  }
  function download(name,type,text){
    var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);
  }

  /* ---- eventos ---- */
  adm.addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t)return;var id=t.id,ds=t.dataset;
    if(ds.tab){tab(ds.tab);return}
    if(ds.pick){pick(+ds.pick);return}
    if(ds.mv){move(+ds.mid,+ds.mv);return}
    if(ds.cm!==undefined){var i=+ds.ci,j=i+(+ds.cm);if(j>=0&&j<st.cats.length){var x=st.cats[i];st.cats[i]=st.cats[j];st.cats[j]=x;catRows()}return}
    if(ds.cd!==undefined){st.cats.splice(+ds.cd,1);catRows();return}
    if(id==="l-back"||id==="a-view"){closeAdmin();return}
    if(id==="a-out"){if(closeAdmin()){authOk=false;try{sessionStorage.removeItem(SKEY)}catch(_){}}return}
    if(id==="a-new"){addNew();return}
    if(id==="a-sort"){mutate(function(){DATA.news.sort(function(a,b){return String(b.date).localeCompare(String(a.date))})},"Ordenado por data (mais recentes primeiro).");items();return}
    if(id==="a-up"){$("#a-file").click();return}
    if(id==="a-pix"){st.draft.img="";st.dirty=true;var fi=$("#f-img");fi.value="";fi.placeholder="https://...";preview();return}
    if(id==="a-disc"){st.dirty=false;st.draft=st.isNew?null:clone(find(st.sel));if(st.isNew)st.isNew=false;items();editor();return}
    if(id==="a-del"){delNews();return}
    if(id==="a-addcat"){st.cats.push({orig:null,name:""});catRows();var ins=adm.querySelectorAll(".a-crow input[data-ci]");var li=ins[ins.length-1];if(li)li.focus();return}
    if(id==="a-savecats"){saveCats();return}
    if(id==="a-dl"){download(FILE,"text/html",buildHtml());lsDel(UKEY);status();toast("Arquivo baixado. Agora é só trocar pelo arquivo antigo no seu site.");return}
    if(id==="a-json"){download("nizzera-noticias.json","application/json",JSON.stringify(DATA,null,1));toast("Backup baixado.");return}
    if(id==="a-imp"){$("#a-impf").click();return}
    if(id==="a-reset"){if(confirm("Descartar tudo o que foi alterado neste navegador e voltar ao conteúdo original do arquivo?")){DATA=clone(BASE);lsDel(DKEY);lsDel(UKEY);refreshAll();status();toast("Conteúdo original restaurado.")}return}
  });
  adm.addEventListener("submit",function(e){
    e.preventDefault();var id=e.target.id;
    if(id==="a-lf"){
      var pw=$("#l-pw").value,has=!!lsGet(AKEY),err=$("#l-err");
      if(has){
        if(Date.now()<lockUntil){err.textContent="Muitas tentativas. Aguarde "+Math.ceil((lockUntil-Date.now())/1000)+"s e tente de novo.";return}
        hashPw(pw).then(function(h){if(h===lsGet(AKEY)){fails=0;login();paint()}else{fails++;if(fails>=5){fails=0;lockUntil=Date.now()+60000;err.textContent="Muitas tentativas. Aguarde 60s."}else err.textContent="Senha incorreta."}})}
      else{
        if(pw.length<8){err.textContent="Use pelo menos 8 caracteres.";return}
        if(pw!==$("#l-pw2").value){err.textContent="As senhas não conferem.";return}
        hashPw(pw).then(function(h){if(!lsSet(AKEY,h)){err.textContent="Este navegador bloqueou o armazenamento, então não dá para criar a senha.";return}login();paint()});
      }
    }
    else if(id==="a-form")saveNews();
    else if(id==="a-site")saveSite();
    else if(id==="a-pwf"){
      var p=$("#p-new").value,er=$("#p-err");er.textContent="";
      if(p.length<8){er.textContent="Use pelo menos 8 caracteres.";return}
      if(p!==$("#p-new2").value){er.textContent="As senhas não conferem.";return}
      hashPw(p).then(function(h){if(lsSet(AKEY,h)){$("#p-new").value="";$("#p-new2").value="";toast("Senha alterada.")}else er.textContent="Não consegui gravar a nova senha neste navegador."});
    }
  });
  adm.addEventListener("input",function(e){
    var t=e.target;
    if(t.id==="a-q"){st.q=t.value;items();return}
    if(t.dataset&&t.dataset.ci!==undefined&&t.tagName==="INPUT"){st.cats[+t.dataset.ci].name=t.value;return}
    if(!t.closest||!t.closest("#a-form")||!st.draft)return;
    st.dirty=true;readForm();
    if(t.id==="f-img")st.draft.img=t.value.trim();
    if(["f-img","f-alt","f-pos","f-title"].indexOf(t.id)>-1)preview();
  });
  adm.addEventListener("change",function(e){
    var t=e.target;
    if(t.id==="a-file"){onFile(t.files&&t.files[0]);t.value=""}
    else if(t.id==="a-impf"){
      var f=t.files&&t.files[0];t.value="";if(!f)return;
      var fr=new FileReader();fr.onerror=function(){toast("Não consegui ler o arquivo.",true)};
      fr.onload=function(){
        var d;try{d=norm(JSON.parse(fr.result))}catch(_){d=null}
        if(!d||!d.news.length){toast("Esse arquivo não parece um backup válido do site.",true);return}
        if(!confirm("Importar "+d.news.length+" notícia(s)? Isso substitui as notícias, categorias e textos atuais."))return;
        if(mutate(function(){DATA=d},"Backup importado.")){st.sel=null;st.draft=null;st.dirty=false;tab(st.tab)}
      };fr.readAsText(f);
    }
  });
  addEventListener("hashchange",function(){
    if(location.hash==="#admin"){if(adm.hidden)openAdmin()}
    else if(!adm.hidden)closeAdmin(true);
  });
  addEventListener("keydown",function(e){if(e.key==="Escape"&&!adm.hidden)closeAdmin()});
  addEventListener("beforeunload",function(e){if(st.dirty&&!adm.hidden){e.preventDefault();e.returnValue=""}});
  if(location.hash==="#admin")openAdmin();
})();
</script>

</body>
</html>
