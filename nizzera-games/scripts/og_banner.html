<!DOCTYPE html>
<!--
  Banner de compartilhamento (og:image) do Nizzera Games: 1200 x 630 px.
  O site usa a imagem pronta em SITE/assets/og/nizzera-games.png (WhatsApp, Discord, X, Facebook...).

  Para mudar o banner: edite este arquivo, abra no Chrome com a janela em 1200 x 630
  (F12 > ícone de celular > Dimensões: 1200 x 630) e salve um print da área em
  SITE/assets/og/nizzera-games.png. Mantenha o mesmo nome de arquivo.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#2433f0;color:#fff;font-family:"DM Sans",sans-serif;
    background-image:radial-gradient(rgba(255,255,255,.16) 1.6px,transparent 1.7px);background-size:28px 28px;background-position:14px 14px}
  .stripe{position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,#ff5c7a 0 20%,#ff8a3d 20% 40%,#ffd23f 40% 60%,#12b886 60% 80%,#4f7cff 80%)}
  .box{position:absolute;inset:0 0 14px;display:flex;align-items:center;gap:56px;padding:0 84px}
  .logo{flex:none;width:250px;height:250px;border-radius:56px;background:#0e1033;display:grid;place-items:center;box-shadow:12px 12px 0 #ffd23f}
  .logo img{width:200px;height:200px}
  h1{font:800 112px/0.95 "Bricolage Grotesque",sans-serif;letter-spacing:-.025em}
  .slogan{margin-top:22px;font:800 50px/1.05 "Bricolage Grotesque",sans-serif;color:#ffd23f;letter-spacing:-.01em}
  .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
  .tags span{font-weight:700;font-size:23px;padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.16)}
  .url{position:absolute;right:84px;top:44px;font-weight:700;font-size:24px;opacity:.85}
</style>
</head>
<body>
  <div class="url">nizzeragames.com.br</div>
  <div class="box">
    <div class="logo"><img src="../SITE/assets/icons/icon-192.png" alt=""></div>
    <div>
      <h1>Nizzera<br>Games</h1>
      <p class="slogan">Seu lugar, a parada gamer</p>
      <div class="tags"><span>Notícias</span><span>Ofertas</span><span>Jogos grátis</span><span>Reviews</span><span>Tier List</span></div>
    </div>
  </div>
  <div class="stripe"></div>
</body>
</html>
